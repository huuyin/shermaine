<helmet>
<style>
body{margin:0}
@keyframes chibi-pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes chibi-tilt{0%{transform:rotate(-7deg)}100%{transform:rotate(7deg)}}
@keyframes chibi-nod{0%{transform:rotate(0deg)}100%{transform:rotate(3deg)}}
@keyframes chibi-leg{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}
@keyframes chibi-wave{0%{transform:rotate(8deg)}100%{transform:rotate(-10deg)}}
@keyframes chibi-glance{0%,15%{transform:translateX(0)}35%,75%{transform:translateX(3px)}95%,100%{transform:translateX(0)}}
@keyframes chibi-push{0%,12%{transform:translateY(0)}24%{transform:translateY(-2px)}36%,100%{transform:translateY(0)}}
@keyframes chibi-flip{0%,25%{transform:scaleX(1)}65%,100%{transform:scaleX(-1)}}
@keyframes chibi-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.chibi-pop{transform-origin:50% 100%;animation:chibi-pop .4s ease-out both}
.chibi-tilt{transform-box:view-box;transform-origin:70px 90px;animation:chibi-tilt 2.4s ease-in-out infinite alternate}
.chibi-nod{transform-box:view-box;transform-origin:70px 90px;animation:chibi-nod 1.8s ease-in-out infinite alternate}
.chibi-legl{transform-box:view-box;transform-origin:60px 128px;animation:chibi-leg 1.4s ease-in-out infinite alternate}
.chibi-legr{transform-box:view-box;transform-origin:80px 128px;animation:chibi-leg 1.4s ease-in-out infinite alternate-reverse}
.chibi-wave{transform-box:view-box;transform-origin:90px 103px;animation:chibi-wave .5s ease-in-out infinite alternate}
.chibi-glance{animation:chibi-glance 3.2s ease-in-out infinite}
.chibi-push{animation:chibi-push 3.2s ease-in-out infinite}
.chibi-flip{transform-box:view-box;transform-origin:70px 115px;animation:chibi-flip 1.8s ease-in-out infinite}
.chibi-blink{transform-box:view-box;transform-origin:70px 65px;animation:chibi-blink 4s linear infinite}
@keyframes chibi-kick{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}
.chibi-kickl{transform-box:view-box;transform-origin:164px 98px;animation:chibi-kick 1.1s ease-in-out infinite alternate}
.chibi-kickr{transform-box:view-box;transform-origin:176px 98px;animation:chibi-kick 1.1s ease-in-out infinite alternate-reverse}
.chibi-nod2{transform-box:view-box;transform-origin:64px 88px;animation:chibi-nod 1.8s ease-in-out infinite alternate}
.chibi-blink2{transform-box:view-box;transform-origin:64px 63px;animation:chibi-blink 4s linear infinite}
.chibi-flip2{transform-box:view-box;transform-origin:64px 99px;animation:chibi-flip 1.8s ease-in-out infinite}
@keyframes chibi-sway{0%{transform:rotate(-3deg)}100%{transform:rotate(4deg)}}
@keyframes chibi-tap{0%,55%{transform:rotate(0deg)}100%{transform:rotate(-10deg)}}
.chibi-nod3{transform-box:view-box;transform-origin:46px 70px;animation:chibi-sway 2.6s ease-in-out infinite alternate}
.chibi-blink3{transform-box:view-box;transform-origin:46px 45px;animation:chibi-blink 4s linear infinite}
.chibi-tap{transform-box:view-box;transform-origin:96px 118px;animation:chibi-tap .9s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.chibi-nod3,.chibi-blink3,.chibi-tap{animation:none}}
@media (prefers-reduced-motion:reduce){.chibi-kickl,.chibi-kickr,.chibi-nod2,.chibi-blink2,.chibi-flip2{animation:none}}
@media (prefers-reduced-motion:reduce){.chibi-pop,.chibi-tilt,.chibi-nod,.chibi-legl,.chibi-legr,.chibi-wave,.chibi-glance,.chibi-push,.chibi-flip,.chibi-blink{animation:none}}
</style>
</helmet>
