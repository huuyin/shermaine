<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span style="display: block; width: 100%; color: inherit">
<sc-if value="{{isObjective}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; width: 100%; height: auto"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
<sc-if value="{{isData}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; width: 100%; height: auto"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v6c0 1.700 3.100 3 7 3s7-1.300 7-3V6"></path><path d="M5 12v6c0 1.700 3.100 3 7 3s7-1.300 7-3v-6"></path></svg>
</sc-if>
<sc-if value="{{isOutcome}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; width: 100%; height: auto"><path d="M4 19h16"></path><path d="M6 15l4-4 3 3 5-6"></path></svg>
</sc-if>
<sc-if value="{{isDesign}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; width: 100%; height: auto"><circle cx="8" cy="8" r="3"></circle><path d="M3 19c0-3 2.200-5 5-5s5 2 5 5"></path><path d="M15 9h6"></path><path d="M18 6l3 3-3 3"></path></svg>
</sc-if>
<sc-if value="{{isGuard}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block; width: 100%; height: auto"><path d="M12 3l7 3v5c0 4.500-3 8-7 10-4-2-7-5.500-7-10V6z"></path></svg>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["objective","data","outcome","design","guard"],"default":"objective"},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'objective';
    return {
      isObjective: kind === 'objective',
      isData: kind === 'data',
      isOutcome: kind === 'outcome',
      isDesign: kind === 'design',
      isGuard: kind === 'guard'
    };
  }
}
</script>
</body>
</html>
